name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for release tag
        id: check
        run: |
          tag=$(git tag --points-at HEAD --list 'v*.*.*' | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release zip
        if: steps.check.outputs.tag != ''
        run: git archive --format=zip --output "agent-${{ steps.check.outputs.tag }}.zip" HEAD

      - name: Create GitHub release
        if: steps.check.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            "agent-${{ steps.check.outputs.tag }}.zip" \
            --title "${{ steps.check.outputs.tag }}" \
            --generate-notes
