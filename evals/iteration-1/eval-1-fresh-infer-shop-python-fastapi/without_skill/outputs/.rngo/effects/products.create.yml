# app/models.py: Product(id, sku, name, price, in_stock, created_at)
# New products are added far less often than orders are placed.
trigger: hz(2, hour)
end: now
channel: db
metadata:
  table: products
schema:
  type: object
  properties:
    id:
      type: number
      minimum: 1
      scale: 0
      step: 1
    sku:
      type: string
      pattern: "[A-Z]{3}-[0-9]{5}"
    name:
      type: string
      pattern: "[A-Za-z0-9' ]{5,60}"
    price:
      type: number
      minimum: 1.99
      maximum: 499.99
      scale: 2
    in_stock:
      type: select
      options:
        - weight: 8
          schema:
            type: constant
            value: true
        - weight: 2
          schema:
            type: constant
            value: false
    created_at:
      type: context
      path: ["clock", "now"]
