trigger: hz(15, hour)
channel: db
metadata:
  table: payments
schema:
  type: object
  properties:
    id:
      type: string
      pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
    order_id:
      type: function
      expression: order.id
      variables:
        order:
          type: reference
          effect: orders.create
    amount:
      type: number
      minimum: 5
      maximum: 500
    paid_at:
      type: context
      path: ["clock", "now"]
