trigger: hz(5, hour)
channel: db
metadata:
  table: customers
schema:
  type: object
  properties:
    id:
      type: string
      pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
    name:
      type: function
      expression: given + ' ' + family
      variables:
        given:
          type: select
          options:
            - schema: { type: constant, value: Alice }
            - schema: { type: constant, value: Bob }
            - schema: { type: constant, value: Priya }
        family:
          type: select
          options:
            - schema: { type: constant, value: Smith }
            - schema: { type: constant, value: Chen }
            - schema: { type: constant, value: Patel }
    email:
      type: function
      expression: local + '@example.com'
      variables:
        local:
          type: string
          pattern: "[a-z]{5,10}"
    created_at:
      type: context
      path: ["clock", "now"]
